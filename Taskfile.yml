version: '3'

vars:
  APP_NAME: "AudioExtractor"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Version stamped into production builds (main.version, shown on the idle
  # screen): the nearest tag, commits since, short hash, -dirty if modified.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  ffmpeg: ./scripts/ffmpeg/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  release:
    summary: Builds the distributable artifacts into dist/ (run from a Mac)
    desc: |
      Builds both ffmpegs if missing, both apps, then packs and verifies:
      dist/AudioExtractor-mac.zip      universal (arm64+amd64), ad-hoc-signed .app + notes
      dist/AudioExtractor-windows.zip  the exe + notes (the one to send)
      dist/AudioExtractor.exe          the same exe on its own (Windows x64, no CGO)
      Every archive carries README-EN.txt, LISEZ-MOI-FR.txt and THIRD_PARTY_NOTICES.txt;
      the apps also embed the notice. Checksums are printed and kept in dist/SHA256SUMS.txt.
    env:
      VERSION: "{{.VERSION}}"
    cmds:
      - rm -rf dist
      - mkdir -p dist
      # The app embeds internal/ffmpeg/bin/darwin/ffmpeg; build it if missing or stale.
      - task: ffmpeg:mac:ensure
      - task: darwin:package:universal
      - bash scripts/release/pack-mac.sh
      # Same for the Windows exe, which embeds internal/ffmpeg/bin/windows/ffmpeg.exe.
      - task: ffmpeg:windows:ensure
      - task: windows:build
        vars:
          ARCH: amd64
          CGO_ENABLED: "0"
      - bash scripts/release/pack-windows.sh
      # Go refuses to overwrite a fat (universal) binary, which would break `task dev` afterwards.
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}"
      - bash scripts/release/verify.sh
