version: '3'

# Slim LGPL ffmpeg builds. Included from the root Taskfile as `ffmpeg:`.
# Shared pins and configure flags live in config.sh, so `ffmpeg:mac` and
# `ffmpeg:windows` build exactly the same ffmpeg. Both run on a Mac.

tasks:
  mac:
    desc: Builds the universal (arm64 + x86_64) slim ffmpeg into internal/ffmpeg/bin/darwin/
    platforms: [darwin]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bash scripts/ffmpeg/build-mac.sh

  mac:ensure:
    summary: Builds the macOS ffmpeg only if it is missing or its build scripts changed
    internal: true
    platforms: [darwin]
    dir: '{{.ROOT_DIR}}'
    status:
      - bash scripts/ffmpeg/build-mac.sh --is-current
    cmds:
      - task: mac

  windows:
    desc: Cross-compiles the Windows x64 slim ffmpeg (mingw-w64) into internal/ffmpeg/bin/windows/
    platforms: [darwin]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bash scripts/ffmpeg/build-windows.sh

  windows:ensure:
    summary: Builds the Windows ffmpeg only if it is missing or its build scripts changed
    internal: true
    platforms: [darwin]
    dir: '{{.ROOT_DIR}}'
    status:
      - bash scripts/ffmpeg/build-windows.sh --is-current
    cmds:
      - task: windows

  smoke:
    desc: Unpacks the embedded ffmpeg through ffmpeg.Path() and runs `ffmpeg -version`
    dir: '{{.ROOT_DIR}}'
    cmds:
      - go test -count=1 -run 'TestBundledFFmpegRuns' -v ./internal/ffmpeg
