<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!--
    Hand-hinted 24 px version of appicon.svg for the .ico: same shapes on
    whole pixels, with one-pixel sprocket holes.
  -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0" stop-color="#4f6cff"/>
      <stop offset="1" stop-color="#6a35d9"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5" fill="url(#plate)" shape-rendering="geometricPrecision"/>
  <g fill="#ffffff">
    <rect x="3" y="4" width="10" height="3"/>
    <rect x="3" y="17" width="10" height="3"/>
    <rect x="3" y="4" width="3" height="16"/>
  </g>
  <g fill="url(#plate)">
    <rect x="7" y="5" width="2" height="1"/>
    <rect x="10" y="5" width="2" height="1"/>
    <rect x="7" y="18" width="2" height="1"/>
    <rect x="10" y="18" width="2" height="1"/>
  </g>
  <g fill="#ffc53d">
    <rect x="8" y="10" width="2" height="4"/>
    <rect x="11" y="9" width="2" height="6"/>
    <rect x="14" y="8" width="2" height="8"/>
    <rect x="17" y="4" width="2" height="16"/>
    <rect x="20" y="7" width="2" height="10"/>
  </g>
</svg>
