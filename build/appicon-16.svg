<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!--
    Hand-hinted 16 px version of appicon.svg for the smallest .ico entry:
    same plate, frame and waveform, on whole pixels, without sprocket holes.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6cff"/>
      <stop offset="1" stop-color="#6a35d9"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#plate)" shape-rendering="geometricPrecision"/>
  <g fill="#ffffff">
    <rect x="2" y="3" width="6" height="2"/>
    <rect x="2" y="11" width="6" height="2"/>
    <rect x="2" y="3" width="2" height="10"/>
  </g>
  <g fill="#ffc53d">
    <rect x="5" y="7" width="1" height="2"/>
    <rect x="7" y="6" width="1" height="4"/>
    <rect x="9" y="5" width="1" height="6"/>
    <rect x="11" y="3" width="1" height="10"/>
    <rect x="13" y="5" width="1" height="6"/>
  </g>
</svg>
