<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>AudioExtractor</title>
</head>
<body>
<main>
    <!-- Idle: the drop zone. Wails adds .file-drop-target-active while a file hovers over it. -->
    <section id="idle" class="screen">
        <!-- The app name in the user's language, when it differs from "AudioExtractor". -->
        <p id="subtitle" class="subtitle" hidden></p>
        <button id="drop" class="zone" type="button" data-file-drop-target>
            <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M8 24v0M14 18v12M20 12v24M26 17v14M32 21v6M38 24v0"/>
            </svg>
            <span class="title" data-i18n="drop.title"></span>
            <span class="hint" data-i18n="drop.hint"></span>
        </button>
        <div class="foot">
            <!-- Opens the third-party licence notice (FFmpeg and LAME are LGPL). -->
            <button id="licences" class="link tiny" type="button" data-i18n="licences.link" data-i18n-title="licences.title"></button>
            <!-- Output format, remembered across launches by the Go service. -->
            <div id="format" class="seg" role="radiogroup" data-i18n-label="format.label">
                <button type="button" role="radio" data-format="m4a" data-i18n="format.m4a"></button>
                <button type="button" role="radio" data-format="mp3" data-i18n="format.mp3"></button>
            </div>
            <!-- Build version (git describe), so we can tell which build someone has. -->
            <span id="version" class="version"></span>
        </div>
    </section>

    <section id="working" class="screen" hidden>
        <p class="title" data-i18n="working.title"></p>
        <p class="hint" id="working-count" hidden></p>
        <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="bar-fill" id="bar-fill"></div></div>
        <p class="hint" id="progress-text"></p>
        <div class="actions">
            <button id="cancel" class="link" type="button" data-i18n="working.cancel"></button>
        </div>
    </section>

    <section id="done" class="screen" hidden>
        <svg class="icon ok" viewBox="0 0 48 48" aria-hidden="true"><path d="M12 25l8 8 16-18"/></svg>
        <p class="title" data-i18n="done.title"></p>
        <p class="hint" id="done-hint"></p>
        <div class="actions">
            <button id="reveal" class="primary" type="button" data-i18n="done.show"></button>
            <button id="again" class="link" type="button" data-i18n="done.again"></button>
        </div>
    </section>

    <!-- End of a batch: counts, then each failed file with its one-sentence message. -->
    <section id="summary" class="screen" hidden>
        <p class="title" id="summary-title"></p>
        <p class="hint" id="summary-counts"></p>
        <ul class="failures" id="failures"></ul>
        <div class="actions">
            <button id="summary-reveal" class="primary" type="button" data-i18n="done.show"></button>
            <button id="summary-copy" class="link" type="button" data-i18n="copy.details"></button>
            <button id="summary-again" class="link" type="button" data-i18n="done.again"></button>
        </div>
    </section>

    <section id="error" class="screen" hidden>
        <p class="title" data-i18n="error.title"></p>
        <p class="hint message" id="error-message"></p>
        <div class="actions row">
            <button id="retry" class="primary" type="button" data-i18n="error.again"></button>
            <button id="copy-details" class="link" type="button" data-i18n="copy.details"></button>
        </div>
    </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
